name: Refresh profile

# Daily: redraw the activity monitor (both accounts' contribution calendars) and list the latest Medium posts.
on:
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/activity.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: node scripts/posts.mjs
      - name: Commit if anything changed
        run: |
          git diff --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am 'Refresh activity and latest writing'
          git push
